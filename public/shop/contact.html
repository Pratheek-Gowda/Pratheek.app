      <h1>Get in Touch</h1>
      <p class="subtitle">
        Have a question, suggestion, or just want to say hello?<br>
        Fill out the form below and I'll get back to you!
      </p>

      <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
        <input type="hidden" name="access_key" value="e7d49fa5-f0e0-4dd9-8f05-7039e4e89cca">
        <input type="hidden" name="redirect" value="https://Pratheek.app/shop/Thank2.html">
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="How can we help you?" style="width:100%; padding:14px 20px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:#fff; font-family:'Poppins',sans-serif;"></textarea>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-paper-plane" style="margin-right:8px;"></i> Send Message
        </button>
      </form>
