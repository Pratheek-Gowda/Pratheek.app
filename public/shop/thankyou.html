<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3137365646817161"
     crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff7eb3, #ff758c, #ff6b6b);
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3em;
            margin: 0;
        }

        p {
            font-size: 1.2em;
            margin: 15px 0;
            line-height: 1.6;
        }

        .icon {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        .button-group {
            margin-top: 20px;
        }

        .button-group a {
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            background: #ffcc00;
            color: #333;
            font-size: 1em;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .button-group a:hover {
            background: #ff9900;
            color: white;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-15px);
            }
            60% {
                transform: translateY(-7px);
            }
        }

        /* Responsive Styles */
        @media only screen and (max-width: 600px) {
            .container {
                padding: 20px;
                width: 90%; /* Make the container responsive */
            }

            h1 {
                font-size: 2.5em; /* Adjust heading size for small screens */
            }

            p {
                font-size: 1em; /* Adjust paragraph size */
            }

            .icon {
                font-size: 4em; /* Adjust icon size */
            }

            .button-group a {
                font-size: 0.9em; /* Adjust button text size */
                padding: 10px 20px; /* Reduce padding */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>Thank You!</h1>
        <p>Your submission was successful. We truly appreciate your effort and will get back to you shortly.</p>
        <div class="button-group">
            <a href="index.html">Go Back to Home</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </div>
</body>
</html>
